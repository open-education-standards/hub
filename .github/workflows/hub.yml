name: Hub

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hub-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Only the build writes store/
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if ! git diff --quiet "origin/$BASE_REF...HEAD" -- store/; then
            echo "This pull request changes store/. Published versions are written by the build, never by hand." >&2
            git diff --stat "origin/$BASE_REF...HEAD" -- store/ >&2
            exit 1
          fi

      - uses: open-education-standards/oes-tooling/.github/actions/hub@main
        with:
          command: check

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: open-education-standards/oes-tooling/.github/actions/hub@main
        with:
          command: build
          out: _site

      - name: Commit newly published versions
        run: |
          if [ -n "$(git status --porcelain -- store/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add store/
            git commit -m "Publish new versions"
            git push
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v5
